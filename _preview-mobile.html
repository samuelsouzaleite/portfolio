<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Preview responsivo</title>
    <style>
        body { margin: 0; background: #333; display: flex; gap: 16px; padding: 16px; font-family: monospace; }
        figure { margin: 0; }
        figcaption { color: #ddd; font-size: 11px; padding: 4px 0; }
        iframe { border: 0; background: #fff; display: block; }
    </style>
</head>
<body>
    <figure>
        <figcaption>390 x 844</figcaption>
        <iframe id="a" src="index.html" width="390" height="844"></iframe>
    </figure>
    <figure>
        <figcaption>768 x 844</figcaption>
        <iframe id="b" src="index.html" width="768" height="844"></iframe>
    </figure>
</body>
</html>
